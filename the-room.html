<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Grid Layout Demo</title>
</head>

<body>
    <div id="page">
    <header>
            <h1>The Room</h1>
    </header>

    <div id="modal" class="modal">
        <span class="close" id="close">&times;</span>
        <img class="modal-content" id="largeImage">
    </div>

    <main>
        <img style="grid-area: 1/1/2/3;" src="grid1.jpg" />
        <img style="grid-area: 2/1;" src="grid2.jpg" />
        <img style="grid-area: 3/1;" src="grid3.jpg" />
        <img style="grid-area: 2/2/4/3;" src="grid4.jpg" />
    </main>
    </div>
    

</body>
