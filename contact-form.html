<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Untitled Document</title>
<style>
    @font-face {
        font-family: Candara;
        src: url("Candara.ttf");
    } h1 {
        text-align: center;
        font-weight: normal;
    } form {
        width: 600px;
        min-height: 600px;
        padding: 24px;
        background: #813ECB;
        margin: 36px auto;
        border: 1px solid lightgreen;
        box-shadow: 2px 3px 6px lightgreen;
        border-radius: 18px;
        font: 14pt/1.2em Candara;
    } fieldset {
        margin-top: 18px;
    } #personal input, #submit {
        width: 100%;
        height: 24px;
        margin-bottom: 12px;
    } input[type="text"] {
        width: 98%,
        font: 14pt/1.4em Candara;
        margin-top: 6px;
    } input[type="submit"] {
        width: 100px;
        heigh: 40px;
        background: lightgreen;
        margin: 6px auto;
        display: block;
        border-radious: 6px;
        border: 1px solid dimgray;
        font: 14pt/1.4em Candara;
    }
</style>
<script language="JavaScript">
    function toggle(source) {
        checkboxes = document.getElementsByName('foo');
        for(var checkbox in checkboxes)
        checkboxes[checkbox].checked = source.checked;
    }
</script>
    
</head>

<body>
    <form action="#" method="post">
    <h1>Through The Room<br/><br/> Contact Form</h1>
    <input type="text" /><br/>
    <label>First name</label><br/>
    <input type="text" /><br/>
    <label>Last name</label><br/>
    <input type="text" /><br/>
    <label>E-mail</label><br/>
    <fieldset>
    <legend>Reason for contacting us</legend>
    <input type="radio" name="service">
    <label>Art service</label><br/>
    <input type="radio" name="service">
    <label>Design service</label><br/>
    <input type="radio" name="service">
    <label>Printing service</label><br/>
    <input type="radio" name="service">
    <label>Other</label>
    </fieldset>
    <fieldset>
    <legend>Type of project</legend>
    <input type="checkbox"  onClick="toggle(this)">
    <label>Check/uncheck all boxes</label><br/>
    <input type="checkbox" name="foo">
    <label>Direct to film</label><br/>
    <input type="checkbox" name="foo">
    <label>Screen printing</label><br/>
    <input type="checkbox" name="foo">
    <label>Sculpture</label><br/>
    <input type="checkbox" name="foo">
    <label>Other</label>
    </fieldset>
    <fieldset>
    <legend>Time frame</legend>
    <select>
        <option>This week</option>
        <option>This month</option>
        <option>This quarter</option>
        <option>Not sure</option>
    </select>
    </fieldset>
    <label>Message</label><br/>
    <textare row="5" cols="72">
    </textare>
    <input type="submit" />
    </form>
</body>
</html>
